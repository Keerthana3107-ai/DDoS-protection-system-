<!DOCTYPE html>
<html>
<head>
    <title>DDoS Monitoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>DDoS Monitoring Dashboard</h1>

<div class="container">
    <h2>Total Requests</h2>
    <p id="total">0</p>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
